[tryton]
version=8.0.0
depends:
    ir
    res
    company
    party
    bank
    account
    account_statement
    account_statement_sepa
xml:
    core/group.xml
    core/menu.xml
    core/message.xml
    connection/format.xml
    connection/configuration.xml
    report/letter.xml
    statement/fetch.xml
    tasks/cron.xml
    connection/account.xml
    log/log.xml
    log/run.xml

[register]
model:
    connection.format.Format
    connection.configuration.Configuration
    connection.configuration.ConfigurationFormat
    connection.configuration.ConfigurationResetDraftStart
    connection.configuration.ConfigurationConfirmBankKeysStart
    statement.fetch.FetchPeriodStart
    statement.fetch.FetchResult
    statement.fetch.FetchResultLine
    statement.fetch.FetchStatementsStart
    tasks.cron.Cron
    connection.account.Account
    log.log.Log
    log.log.LogFile
    log.log.LogFileStatement
    log.run.Run
wizard:
    connection.configuration.ConfigurationResetDraft
    connection.configuration.ConfigurationConfirmBankKeys
    statement.fetch.FetchStatements
    statement.fetch.FetchPeriod
report:
    report.letter.IniLetterIni
    report.letter.IniLetterHia
